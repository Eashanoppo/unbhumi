<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <!-- Document Sheet -->
  <rect width="600" height="800" rx="8" fill="#FFFFFF" stroke="#E5E0D2" stroke-width="4"/>
  
  <!-- Stamp Header (Bangladesh Non-Judicial Stamp Style) -->
  <rect x="50" y="40" width="500" height="130" rx="6" fill="#FBF8EE" stroke="#286B35" stroke-width="2"/>
  <circle cx="300" cy="95" r="35" fill="#7ED957" fill-opacity="0.3" stroke="#286B35" stroke-width="2"/>
  <text x="300" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#286B35">বাংলাদেশ</text>
  <text x="300" y="110" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#286B35">১০০ টাকা</text>
  <text x="300" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#263126">সাফ-কবলা জমি বিক্রয় দলিল</text>

  <!-- Deed Body Lines -->
  <rect x="70" y="210" width="460" height="12" rx="4" fill="#E5E0D2"/>
  <rect x="70" y="240" width="420" height="12" rx="4" fill="#E5E0D2"/>
  <rect x="70" y="270" width="450" height="12" rx="4" fill="#E5E0D2"/>
  <rect x="70" y="300" width="380" height="12" rx="4" fill="#E5E0D2"/>

  <!-- Highlighted Extracted Box (OCR Emulation) -->
  <rect x="65" y="350" width="470" height="95" rx="6" fill="#7ED957" fill-opacity="0.12" stroke="#286B35" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="85" y="380" font-family="sans-serif" font-size="14" font-weight="bold" fill="#286B35">তফসিল বর্ণনা (নিষ্কাশিত তথ্য):</text>
  <text x="85" y="405" font-family="sans-serif" font-size="13" fill="#263126">মৌজা: কাউন্দিয়া | খতিয়ান নং: ৫৮৩ | আরএস দাগ: ৪১২</text>
  <text x="85" y="428" font-family="sans-serif" font-size="13" fill="#263126">জমির পরিমাণ: ২৫ শতাংশ (০.২৫ একর) | বিক্রেতা: মো: আব্দুর রহিম</text>

  <!-- More text lines -->
  <rect x="70" y="480" width="460" height="12" rx="4" fill="#E5E0D2"/>
  <rect x="70" y="510" width="440" height="12" rx="4" fill="#E5E0D2"/>
  <rect x="70" y="540" width="390" height="12" rx="4" fill="#E5E0D2"/>

  <!-- Official Registry Seals -->
  <circle cx="150" cy="670" r="45" fill="#E8A23A" fill-opacity="0.15" stroke="#E8A23A" stroke-width="2"/>
  <text x="150" y="665" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#E8A23A">সাব-রেজিস্ট্রি</text>
  <text x="150" y="682" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E8A23A">সাভার, ঢাকা</text>

  <!-- Verified Cryptographic Fingerprint QR Box -->
  <rect x="380" y="620" width="130" height="100" rx="8" fill="#F5EEDC" stroke="#7ED957" stroke-width="2"/>
  <text x="445" y="650" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#286B35">SHA-256 ভ্যালিডেশন</text>
  <text x="445" y="680" text-anchor="middle" font-family="monospace" font-size="10" fill="#697265">7a9f...3e21</text>
  <text x="445" y="700" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2E7D46">✓ এনরোল্ড</text>
</svg>
